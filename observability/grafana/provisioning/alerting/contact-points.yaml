apiVersion: 1
contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        settings:
          # The responder runs on the host because it starts the local coding agent.
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: incident-responder
    group_by: [grafana_folder, alertname]
    group_wait: 5s
    group_interval: 1m
    repeat_interval: 1h
